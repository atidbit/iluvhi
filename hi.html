<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HI! Your Daily Aloha</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 40%, #0c4a6e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      padding: 2rem 1rem;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2rem 1.5rem 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    .sunset {
      width: 100%;
      border-radius: 16px;
      display: block;
      margin-bottom: 1.75rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .sunset:hover {
      transform: scale(1.015);
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
      background: linear-gradient(90deg, #fbbf24, #f97316, #fb7185);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.25rem;
      font-weight: 400;
      color: #94a3b8;
      margin-bottom: 2rem;
      letter-spacing: 0.02em;
    }

    .line-link {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease;
    }

    .line-link:hover {
      transform: translateY(-4px);
    }

    .line-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: box-shadow 0.25s ease;
    }

    .line-link:hover .line-icon {
      box-shadow: 0 12px 28px rgba(0, 200, 83, 0.35);
    }

    .cta {
      font-size: 0.95rem;
      font-weight: 500;
      color: #e2e8f0;
      background: rgba(0, 200, 83, 0.15);
      border: 1px solid rgba(0, 200, 83, 0.3);
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.25rem;
      }
      .card {
        padding: 1.5rem 1.25rem 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="https://line.me/ti/p/ur0-XvreIm">
      <img 
        class="sunset" 
        src="https://live.staticflickr.com/3687/10480193445_ecd234563e_c.jpg" 
        alt="Paradise Cove Sunset"
        width="800"
        height="598"
      >
    </a>

    <a href="https://line.me/ti/p/ur0-XvreIm" style="text-decoration: none;">
      <h1>HI!</h1>
    </a>
    <p class="subtitle">Your Daily Aloha!</p>

    <a href="https://line.me/ti/p/ur0-XvreIm" class="line-link">
      <img 
        class="line-icon" 
        src="https://iluvhi.com/files/IMG_7203.jpeg" 
        alt="Add me on LINE"
      >
      <span class="cta">Add on LINE</span>
    </a>
  </div>
</body>
</html>
